<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verse of the Day</title>
  <meta name="description" content="Today's Verse of the Day from the Berean Standard Bible, powered by the YouVersion Platform.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg-1: #fff5f7;
      --bg-2: #fde8ef;
      --bg-3: #f3e8ff;
      --card: rgba(255, 255, 255, 0.78);
      --ink: #4a2c3a;
      --ink-soft: #8a5a6e;
      --accent: #d9668f;
      --leaf: #8fbf8a;
      --petal-1: #f7a8c4;
      --petal-2: #f9c8d9;
      --petal-3: #e7c6f5;
      --center: #f6d36b;
      --shadow: 0 20px 60px rgba(217, 102, 143, 0.18);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-1: #2a1a24;
        --bg-2: #33202d;
        --bg-3: #261d33;
        --card: rgba(48, 30, 42, 0.8);
        --ink: #fbe9f0;
        --ink-soft: #d7aabd;
        --accent: #f59bbb;
        --leaf: #7aa876;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Cormorant Garamond", Georgia, serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, var(--bg-2) 0, transparent 45%),
        radial-gradient(circle at 85% 80%, var(--bg-3) 0, transparent 45%),
        var(--bg-1);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Corner bouquets */
    .bouquet {
      position: fixed;
      width: min(42vw, 340px);
      pointer-events: none;
      opacity: 0.95;
      z-index: 0;
    }
    .bouquet.tl { top: -30px; left: -30px; }
    .bouquet.br { bottom: -30px; right: -30px; transform: rotate(180deg); }

    /* Falling petals */
    .petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .petal {
      position: absolute;
      top: -40px;
      width: 14px;
      height: 18px;
      background: var(--petal-1);
      border-radius: 80% 0 80% 0;
      opacity: 0.7;
      animation: fall linear infinite;
    }
    @keyframes fall {
      0%   { transform: translate(0, 0) rotate(0deg); }
      50%  { transform: translate(40px, 55vh) rotate(180deg); }
      100% { transform: translate(-20px, 110vh) rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .petal { display: none; }
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 640px;
      text-align: center;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 32px;
      padding: 48px 40px 40px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(217, 102, 143, 0.2);
      position: relative;
    }

    .eyebrow {
      font-family: "Great Vibes", cursive;
      font-size: clamp(2.2rem, 6vw, 3rem);
      color: var(--accent);
      line-height: 1;
    }

    .date {
      margin-top: 8px;
      font-size: 1rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .divider {
      display: block;
      margin: 24px auto;
      width: 180px;
      height: 32px;
    }

    blockquote {
      font-size: clamp(1.4rem, 4.2vw, 1.95rem);
      line-height: 1.5;
      font-style: italic;
      min-height: 3em;
      transition: opacity 0.6s ease;
    }
    blockquote.loading { opacity: 0.4; }

    .reference {
      display: inline-block;
      margin-top: 24px;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      letter-spacing: 0.04em;
    }
    .reference:hover { text-decoration: underline; }

    .version {
      margin-top: 4px;
      font-size: 0.95rem;
      color: var(--ink-soft);
    }

    footer {
      margin-top: 24px;
      font-size: 0.9rem;
      color: var(--ink-soft);
    }
    footer a { color: inherit; }

    @media (max-width: 480px) {
      .card { padding: 36px 22px 28px; border-radius: 24px; }
    }
  </style>
</head>
<body>
  <!-- Reusable flower bouquet -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <g id="flower">
        <g fill="var(--petal-1)">
          <ellipse cx="0" cy="-16" rx="10" ry="16"/>
          <ellipse cx="0" cy="-16" rx="10" ry="16" transform="rotate(72)"/>
          <ellipse cx="0" cy="-16" rx="10" ry="16" transform="rotate(144)"/>
          <ellipse cx="0" cy="-16" rx="10" ry="16" transform="rotate(216)"/>
          <ellipse cx="0" cy="-16" rx="10" ry="16" transform="rotate(288)"/>
        </g>
        <circle r="7" fill="var(--center)"/>
      </g>
      <g id="flower2">
        <g fill="var(--petal-3)">
          <ellipse cx="0" cy="-12" rx="7" ry="12"/>
          <ellipse cx="0" cy="-12" rx="7" ry="12" transform="rotate(60)"/>
          <ellipse cx="0" cy="-12" rx="7" ry="12" transform="rotate(120)"/>
          <ellipse cx="0" cy="-12" rx="7" ry="12" transform="rotate(180)"/>
          <ellipse cx="0" cy="-12" rx="7" ry="12" transform="rotate(240)"/>
          <ellipse cx="0" cy="-12" rx="7" ry="12" transform="rotate(300)"/>
        </g>
        <circle r="5" fill="#fff4c2"/>
      </g>
      <path id="leaf" d="M0 0 C 12 -10, 30 -10, 40 0 C 30 10, 12 10, 0 0 Z" fill="var(--leaf)"/>
      <g id="bouquet">
        <use href="#leaf" transform="translate(60 150) rotate(-30)"/>
        <use href="#leaf" transform="translate(140 60) rotate(40)"/>
        <use href="#leaf" transform="translate(30 90) rotate(-80)"/>
        <use href="#leaf" transform="translate(180 120) rotate(10)"/>
        <use href="#leaf" transform="translate(100 200) rotate(-50)"/>
        <use href="#flower" transform="translate(70 70) scale(1.6)"/>
        <use href="#flower2" transform="translate(150 110) scale(1.3)"/>
        <use href="#flower" transform="translate(40 170) scale(1.1)"/>
        <use href="#flower2" transform="translate(120 30) scale(1)"/>
        <use href="#flower2" transform="translate(200 40) scale(0.8)"/>
        <use href="#flower" transform="translate(230 170) scale(0.7)"/>
        <use href="#flower2" transform="translate(90 240) scale(0.9)"/>
        <circle cx="185" cy="80" r="4" fill="var(--petal-2)"/>
        <circle cx="20" cy="40" r="5" fill="var(--petal-2)"/>
        <circle cx="160" cy="210" r="3" fill="var(--petal-3)"/>
      </g>
    </defs>
  </svg>

  <svg class="bouquet tl" viewBox="0 0 280 280" aria-hidden="true"><use href="#bouquet"/></svg>
  <svg class="bouquet br" viewBox="0 0 280 280" aria-hidden="true"><use href="#bouquet"/></svg>

  <div class="petals" id="petals" aria-hidden="true"></div>

  <main>
    <article class="card">
      <h1 class="eyebrow">Verse of the Day</h1>
      <p class="date" id="date"></p>

      <svg class="divider" viewBox="0 0 180 32" aria-hidden="true">
        <line x1="0" y1="16" x2="70" y2="16" stroke="var(--accent)" stroke-width="1" opacity="0.5"/>
        <line x1="110" y1="16" x2="180" y2="16" stroke="var(--accent)" stroke-width="1" opacity="0.5"/>
        <use href="#flower" transform="translate(90 16) scale(0.45)"/>
      </svg>

      <blockquote id="verse" class="loading">Gathering today’s verse…</blockquote>
      <a class="reference" id="reference" href="https://www.bible.com/verse-of-the-day" target="_blank" rel="noopener"></a>
      <p class="version" id="version"></p>
    </article>

    <footer>
      Powered by the <a href="https://developers.youversion.com" target="_blank" rel="noopener">YouVersion Platform</a>
    </footer>
  </main>

  <script>
    const APP_KEY = "Es5gfmkCMjHqsfwk2hXDrhdG3GheWPqfER4Zrc45SdaZ5usl";
    const BIBLE_ID = 3034; // Berean Standard Bible (BSB)
    const API = "https://api.youversion.com/v1";

    const $ = (id) => document.getElementById(id);

    function dayOfYear(d) {
      const start = new Date(d.getFullYear(), 0, 0);
      const diff = d - start + (start.getTimezoneOffset() - d.getTimezoneOffset()) * 60000;
      return Math.floor(diff / 86400000);
    }

    async function api(path) {
      const res = await fetch(API + path, { headers: { "X-YVP-App-Key": APP_KEY } });
      if (!res.ok) throw new Error(`${res.status} ${res.statusText} for ${path}`);
      return res.json();
    }

    async function loadVerse() {
      const today = new Date();
      $("date").textContent = today.toLocaleDateString(undefined, {
        weekday: "long", month: "long", day: "numeric", year: "numeric",
      });

      try {
        const votd = await api(`/verse-of-the-days/${dayOfYear(today)}`);
        const [passage, bible] = await Promise.all([
          api(`/bibles/${BIBLE_ID}/passages/${votd.passage_id}?format=text`),
          api(`/bibles/${BIBLE_ID}`),
        ]);

        $("verse").textContent = `“${passage.content.trim()}”`;
        $("reference").textContent = passage.reference;
        $("reference").href = `https://www.bible.com/bible/${BIBLE_ID}/${votd.passage_id}.${bible.abbreviation}`;
        $("version").textContent = `${bible.title} (${bible.abbreviation}) · ${bible.copyright}`;
      } catch (err) {
        console.error(err);
        $("verse").textContent = "We couldn’t load today’s verse. Please try again soon.";
      } finally {
        $("verse").classList.remove("loading");
      }
    }

    function makePetals(count = 18) {
      const colors = ["var(--petal-1)", "var(--petal-2)", "var(--petal-3)"];
      const box = $("petals");
      for (let i = 0; i < count; i++) {
        const p = document.createElement("span");
        p.className = "petal";
        const size = 10 + Math.random() * 10;
        p.style.left = `${Math.random() * 100}vw`;
        p.style.width = `${size}px`;
        p.style.height = `${size * 1.3}px`;
        p.style.background = colors[i % colors.length];
        p.style.animationDuration = `${10 + Math.random() * 12}s`;
        p.style.animationDelay = `${-Math.random() * 20}s`;
        box.appendChild(p);
      }
    }

    makePetals();
    loadVerse();
  </script>
</body>
</html>
